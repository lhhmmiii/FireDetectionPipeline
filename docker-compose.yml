# =============================================================================
# Fire Detection Pipeline — Docker Compose
# =============================================================================
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up -d kafka    # Start only Kafka
#   docker compose logs -f        # Follow all logs
#   docker compose down           # Stop all services
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure: Kafka (KRaft mode, no Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: fire-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      CLUSTER_ID: fire-detection-kraft-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fire-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: FireDetection
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Media Gateway (MediaMTX)
  # ---------------------------------------------------------------------------
  mediamtx:
    build:
      context: ./services/media_gateway
      dockerfile: Dockerfile
    container_name: fire-mediamtx
    ports:
      - "8554:8554" # RTSP
      - "8889:8889/tcp" # WebRTC WHEP (HTTP signalling)
      - "8889:8889/udp" # WebRTC ICE media (UDP mux)
      - "9997:9997" # API
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frame Extractor — Base template (YAML anchor)
  # ---------------------------------------------------------------------------
  x-frame-extractor-base: &frame-extractor-base
    build:
      context: .
      dockerfile: ./services/frame_extractor/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mediamtx:
        condition: service_started
    environment: &frame-extractor-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_FRAMES: frames
      KAFKA_TOPIC_METRICS: metrics
      METRICS_ENABLED: "true"
      RTSP_RECONNECT_DELAY: 5
      RTSP_MAX_RETRIES: 0
      FRAME_EXTRACT_FPS: 10
      FRAME_RESIZE_WIDTH: 640
      FRAME_RESIZE_HEIGHT: 480
      FRAME_SKIP_ON_OVERLOAD: "true"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./shared:/app/shared:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frame Extractor — Stream Instances
  # ---------------------------------------------------------------------------
  frame_extractor_stream1:
    <<: *frame-extractor-base
    container_name: fire-frame-extractor-stream1
    environment:
      <<: *frame-extractor-env
      SOURCE_ID: camera-1
      RTSP_URL: rtsp://mediamtx:8554/stream1

  frame_extractor_stream2:
    <<: *frame-extractor-base
    container_name: fire-frame-extractor-stream2
    environment:
      <<: *frame-extractor-env
      SOURCE_ID: camera-2
      RTSP_URL: rtsp://mediamtx:8554/stream2

  # ---------------------------------------------------------------------------
  # Detection Service
  # ---------------------------------------------------------------------------
  detection:
    build:
      context: .
      dockerfile: ./services/detection/Dockerfile
    container_name: fire-detection
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_FRAMES: frames
      KAFKA_TOPIC_DETECTIONS: detections
      KAFKA_TOPIC_METRICS: metrics
      METRICS_ENABLED: "true"
      DETECTION_MODEL_PATH: /app/models/rfdetr-nano-int8.engine
      DETECTION_CONFIDENCE_THRESHOLD: 0.5
      DETECTION_DEVICE: cuda
      DETECTION_BATCH_SIZE: 1
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./shared:/app/shared:ro
      - ./models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Tracking Service
  # ---------------------------------------------------------------------------
  tracking:
    build:
      context: .
      dockerfile: ./services/tracking/Dockerfile
    container_name: fire-tracking
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_DETECTIONS: detections
      KAFKA_TOPIC_TRACKS: tracks
      KAFKA_TOPIC_METRICS: metrics
      METRICS_ENABLED: "true"
      TRACKING_MAX_AGE: 30
      TRACKING_MIN_HITS: 3
      TRACKING_IOU_THRESHOLD: 0.3
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./shared:/app/shared:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: ./services/dashboard/Dockerfile
    container_name: fire-dashboard
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_TRACKS: tracks
      KAFKA_TOPIC_METRICS: metrics
      METRICS_ENABLED: "true"
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: 8080
      WEBRTC_URL: http://localhost:8889
      DASHBOARD_STREAMS: "camera-1:stream1,camera-2:stream2"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./shared:/app/shared:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Monitoring — pipeline latency/throughput/drop-rate dashboard
  # ---------------------------------------------------------------------------
  monitoring:
    build:
      context: .
      dockerfile: ./services/monitoring/Dockerfile
    container_name: fire-monitoring
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_METRICS: metrics
      MONITORING_HOST: "0.0.0.0"
      MONITORING_PORT: 8090
      METRICS_WINDOW_SECONDS: 60
      MONITORING_BASELINE_DIR: /app/data/baselines
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./shared:/app/shared:ro
      - monitoring-baselines:/app/data/baselines
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  kafka-data:
  monitoring-baselines:
